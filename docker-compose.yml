services:
  audiobook:
    image: nkostylev/ai-dubbing:latest
    container_name: ai-dubbing-audiobook
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint.sh"]
    restart: unless-stopped
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - AUDIOBOOK_ROOT_DIR=/app
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Host bind mounts for persistence
      - ./output:/app/output
      - ./work:/app/work
      - ./voices:/app/voices:ro
      - ./run_audiobook.py:/app/run_audiobook.py
      - ./scripts:/app/scripts
      - ./fanfic_pipeline:/app/fanfic_pipeline
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh
      # Model caches (so models are downloaded once and preserved across container restarts)
      - cosyvoice_models:/app/CosyVoice/pretrained_models
      - whisper_cache:/root/.cache/whisper

volumes:
  cosyvoice_models:
    name: ai_dubbing_cosyvoice_models
  whisper_cache:
    name: ai_dubbing_whisper_cache
